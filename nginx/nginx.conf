# GoAnalyze production reverse proxy.
#
# Terminates TLS, enforces HSTS/security headers at the edge (defense in
# depth alongside the app's own security-headers middleware), and routes
# /api/* to the backend and everything else to the frontend. Rate limiting
# here is a coarse edge-level backstop; the app's own Redis-backed limiter
# (per-IP/user/tenant) remains the authoritative control.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;  # don't advertise nginx version

    # Coarse edge-level rate limit backstop (10 req/s per IP, small burst).
    limit_req_zone $binary_remote_addr zone=edge_limit:10m rate=10r/s;

    upstream goanalyze_backend {
        server api:8080;
        keepalive 32;
    }

    upstream goanalyze_frontend {
        server frontend:3000;
        keepalive 16;
    }

    # Plain HTTP: redirect everything to HTTPS.
    server {
        listen 80;
        server_name _;
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        client_max_body_size 100m;  # matches the app's own MAX_UPLOAD_BYTES cap

        location /api/ {
            limit_req zone=edge_limit burst=20 nodelay;

            proxy_pass http://goanalyze_backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Liveness/readiness probes bypass the rate limiter -- orchestrators
        # poll these frequently and must not be throttled.
        location = /api/health {
            proxy_pass http://goanalyze_backend/health;
            proxy_set_header Host $host;
        }

        location = /api/ready {
            proxy_pass http://goanalyze_backend/ready;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://goanalyze_frontend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
