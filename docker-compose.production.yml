# Production topology for GoAnalyze.
#
# Differences from docker-compose.yml (the dev/base file):
#   - Nginx terminates TLS and is the only service with a published port.
#   - Every service has a real healthcheck and a restart policy.
#   - Resource limits are set so one runaway container can't starve the host.
#   - Keycloak runs in production mode (`start`, not `start-dev`) against
#     its own PostgreSQL database, with hostname/proxy settings for
#     running behind Nginx.
#   - The backend uses multiple worker processes (see Dockerfile.production).
#
# IMPORTANT -- Keycloak realm provisioning: creating a realm via the bare
# Admin REST API (`POST /admin/realms`) does NOT provision a working User
# Profile, which silently blocks every password-grant login with a
# misleading "Account is not fully set up" error. See
# ROOT_CAUSE_ANALYSIS.md for the full diagnosis. Provision the realm from
# a complete JSON export (via --import-realm) or explicitly configure
# `PUT /admin/realms/{realm}/users/profile` as part of realm setup -- do
# not create it with a minimal {"realm": ..., "enabled": true} body.

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_DIR:?set TLS_CERT_DIR to a directory containing fullchain.pem and privkey.pem}:/etc/nginx/tls:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

  api:
    build:
      context: .
      dockerfile: Dockerfile.production
    restart: unless-stopped
    environment:
      GOV_ENVIRONMENT: production
      GOV_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      GOV_REDIS_URL: redis://redis:6379/0
      GOV_OPENSEARCH_URL: http://opensearch:9200
      GOV_MINIO_ENDPOINT: minio:9000
      GOV_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      GOV_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      GOV_KEYCLOAK_ISSUER: ${GOV_KEYCLOAK_ISSUER:?set GOV_KEYCLOAK_ISSUER, e.g. https://auth.example.gov/realms/goanalyze}
      GOV_KEYCLOAK_AUDIENCE: ${GOV_KEYCLOAK_AUDIENCE:-goanalyze-api}
      GOV_ALLOW_INSECURE_DEV_AUTH: "false"
      GOV_AUDIT_HASH_SECRET: ${GOV_AUDIT_HASH_SECRET:?set GOV_AUDIT_HASH_SECRET to a strong, unique value - never commit a real value}
      GOV_ALLOWED_ORIGINS: ${GOV_ALLOWED_ORIGINS:?set GOV_ALLOWED_ORIGINS, e.g. ["https://goanalyze.example.gov"]}
      GOV_RATE_LIMIT_ENABLED: "true"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "2", memory: 1G }

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_GOV_API_URL: ${NEXT_PUBLIC_GOV_API_URL:?set NEXT_PUBLIC_GOV_API_URL}
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?set OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1", memory: 1G }

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    # Production mode (not start-dev): backed by real Postgres, expects a
    # reverse proxy in front of it for TLS.
    command: ["start", "--optimized", "--proxy-headers=xforwarded", "--hostname-strict=false"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: "2", memory: 1G }

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafanadata:/var/lib/grafana
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  loki:
    image: grafana/loki:3.1.0
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - lokidata:/loki
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

volumes:
  pgdata:
  redisdata:
  opensearchdata:
  miniodata:
  prometheusdata:
  grafanadata:
  lokidata:
