# All secrets below are sourced from environment variables (populate them via
# a .env file copied from .env.example, or your secrets manager / CI
# pipeline). None of them have insecure defaults baked into this file:
# docker compose will refuse to start if a required one is missing.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      GOV_ENVIRONMENT: ${GOV_ENVIRONMENT:?set GOV_ENVIRONMENT (development|staging|production)}
      GOV_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      GOV_REDIS_URL: redis://redis:6379/0
      GOV_OPENSEARCH_URL: http://opensearch:9200
      GOV_MINIO_ENDPOINT: minio:9000
      GOV_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GOV_TEMPORAL_TARGET_HOST: temporal:7233
      GOV_KEYCLOAK_ISSUER: ${GOV_KEYCLOAK_ISSUER:-http://keycloak:8080/realms/goanalyze}
      GOV_KEYCLOAK_AUDIENCE: ${GOV_KEYCLOAK_AUDIENCE:-goanalyze-api}
      GOV_ALLOW_INSECURE_DEV_AUTH: ${GOV_ALLOW_INSECURE_DEV_AUTH:-false}
      GOV_AUDIT_HASH_SECRET: ${GOV_AUDIT_HASH_SECRET:?set GOV_AUDIT_HASH_SECRET to a strong, unique value - never commit a real value}
      GOV_ALLOWED_ORIGINS: ${GOV_ALLOWED_ORIGINS:-["http://localhost:3000"]}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - opensearch
      - minio
      - kafka
      - temporal

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_GOV_API_URL: ${NEXT_PUBLIC_GOV_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      - api

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?set OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ports:
      - "9200:9200"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  temporal:
    image: temporalio/auto-setup:1.24.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
    depends_on:
      - postgres

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8081:8080"

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    ports:
      - "3001:3000"

  loki:
    image: grafana/loki:3.1.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"

volumes:
  pgdata:
  miniodata:
